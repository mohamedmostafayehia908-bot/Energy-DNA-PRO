<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnergyDNA – Site Energy Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --surface2:#21262d; --border:#30363d;
    --accent:#2ea043; --accent2:#388bfd; --accent3:#e3882a; --pink:#db61a2; --red:#f85149;
    --text:#c9d1d9; --text-muted:#8b949e; --white:#f0f6fc;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.55}
  body.ar{font-family:'Cairo',sans-serif;direction:rtl}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 40% at 15% 10%,rgba(56,139,253,.06),transparent 55%);pointer-events:none;z-index:0}
  .wrapper{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 20px 40px}
  :focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

  header{padding:22px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{width:38px;height:38px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .logo-text h1{font-size:20px;font-weight:700;color:var(--white);letter-spacing:-.3px}
  .logo-text p{font-size:11px;color:var(--text-muted);font-weight:500}
  .lang-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);padding:6px 16px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600}
  .lang-btn:hover{border-color:var(--accent2);color:var(--text)}

  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);padding:10px 16px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--white);border-bottom-color:var(--accent)}
  .tabpane{display:none}.tabpane.active{display:block}

  .hero{padding:30px 0 20px;max-width:760px}
  .hero h2{font-size:clamp(24px,4vw,36px);line-height:1.15;font-weight:800;color:var(--white);margin-bottom:10px;letter-spacing:-.5px}
  .hero p{font-size:14px;color:var(--text-muted)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:16px}
  .card-title{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;font-size:15px;font-weight:700;color:var(--white)}
  .card-title small{font-size:12px;font-weight:500;color:var(--text-muted)}
  .card-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px}
  .sec-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:26px 0 12px}
  body.ar .sec-title{letter-spacing:0;font-size:13px}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--text-muted)}
  .hint{font-size:11px;color:var(--text-muted);opacity:.85}
  input,select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;font-family:inherit;font-size:13px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2)}
  input[type=range]{padding:0;accent-color:var(--accent)}
  textarea{min-height:110px;resize:vertical;font-family:'Space Mono',monospace;font-size:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row .grow{flex:1;min-width:180px}

  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:7px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.big{width:100%;padding:14px;font-size:15px;margin-top:6px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .seg button{background:var(--bg);border:none;color:var(--text-muted);padding:8px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--surface2);color:var(--white)}

  .map-wrap{position:relative;height:420px;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:12px 0;direction:ltr;background:var(--surface2)}
  #map-leaflet,#map-google{position:absolute;inset:0}
  #map-google{display:none}
  .pin{background:none;border:none}
  .pin-dot{width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--red);border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .coords{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);background:rgba(46,160,67,.1);border:1px solid rgba(46,160,67,.25);border-radius:6px;padding:6px 10px;display:none}
  .gkey{display:none;margin-top:10px;padding:12px;background:var(--bg);border:1px dashed var(--border);border-radius:8px}
  .gkey.show{display:block}

  details.adv{margin-top:14px;border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--bg)}
  details.adv summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--text)}
  details.adv .grid{margin-top:12px}

  .status{display:none;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;font-size:13px;margin-top:12px}
  .status.loading{display:flex;background:rgba(56,139,253,.1);border:1px solid rgba(56,139,253,.3);color:#79b8ff}
  .status.error{display:flex;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:#ff7b72}
  .status.warn{display:flex;background:rgba(227,136,42,.1);border:1px solid rgba(227,136,42,.3);color:#f0a95a}
  .spinner{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spinner{animation-duration:2s}html{scroll-behavior:auto}}

  #site-results{display:none}
  .tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .tile .v{font-family:'Space Mono',monospace;font-size:19px;font-weight:700;color:var(--white)}
  .tile .u{font-size:10px;color:var(--text-muted)}
  .tile .l{font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:600}

  .winner{background:linear-gradient(135deg,rgba(46,160,67,.16),rgba(56,139,253,.1));border:1px solid rgba(46,160,67,.45);border-radius:12px;padding:22px;margin:18px 0}
  .winner .kick{font-size:12px;color:var(--accent);font-weight:700}
  .winner h3{font-size:clamp(22px,3.4vw,30px);color:var(--white);margin:4px 0 8px;font-weight:800}
  .winner p{font-size:13px;color:var(--text);max-width:780px}
  .winner ul{margin:10px 0 0;padding-inline-start:18px;font-size:13px}
  .winner li{margin-bottom:3px}

  .tech-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .tech{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
  .tech.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .tech.dim{opacity:.82}
  .tech-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
  .tech-h b{font-size:15px;color:var(--white)}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;border:1px solid}
  .chip.best{color:#56d364;border-color:rgba(86,211,100,.5);background:rgba(46,160,67,.15)}
  .chip.viable{color:#79b8ff;border-color:rgba(56,139,253,.5);background:rgba(56,139,253,.12)}
  .chip.marginal{color:#f0a95a;border-color:rgba(227,136,42,.5);background:rgba(227,136,42,.12)}
  .chip.poor{color:#ff7b72;border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.12)}
  .chip.data,.chip.na,.chip.info{color:var(--text-muted);border-color:var(--border);background:var(--surface2)}
  .score{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .score .n{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--white);min-width:44px}
  .bar{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12px}
  .kv span:nth-child(odd){color:var(--text-muted)}
  .kv span:nth-child(even){color:var(--white);font-family:'Space Mono',monospace;text-align:end}
  .tech .note{margin-top:10px;font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:8px}

  .tscroll{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:12px;min-width:680px}
  th,td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:start;white-space:nowrap}
  th{background:var(--surface2);color:var(--text-muted);font-weight:700;font-size:11px}
  td.num{font-family:'Space Mono',monospace;color:var(--white)}
  tr.win td{background:rgba(46,160,67,.08)}

  .spec{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .spec div{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:12px;text-align:center}
  .spec b{display:block;font-family:'Space Mono',monospace;font-size:18px;color:var(--accent)}
  .spec span{font-size:11px;color:var(--text-muted)}

  .charts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
  .chart-card h4{font-size:13px;color:var(--white);margin-bottom:10px}
  .chart-box{position:relative;height:290px;direction:ltr}
  @media(max-width:520px){.charts{grid-template-columns:1fr}}

  .tips{list-style:none;display:grid;gap:8px}
  .tips li{display:flex;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 14px;font-size:12.5px}
  .tips li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
  .tips li.warn::before{background:var(--accent3)}
  .disclaimer{font-size:11.5px;color:var(--text-muted);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-top:14px;background:var(--surface)}

  .metrics-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .metric-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
  .metric-label{font-size:11px;font-weight:700;color:var(--text-muted)}
  .metric-value{font-family:'Space Mono',monospace;font-size:21px;font-weight:700;color:var(--white);margin:3px 0}
  .metric-desc{font-size:10.5px;color:var(--text-muted)}
  .interp{list-style:none;display:grid;gap:8px}
  .interp li{display:flex;gap:10px;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 14px}
  .interp .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
  .interp .dot.warn{background:var(--accent3)}.interp .dot.info{background:var(--accent2)}
  .output-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px}
  .output-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
  .output-card b{display:block;font-family:'Space Mono',monospace;font-size:22px;color:var(--accent)}
  .output-card span{font-size:11px;color:var(--text-muted)}
  .err{display:none;color:#ff7b72;font-size:12.5px;margin-top:8px}

  footer{border-top:1px solid var(--border);padding:20px 0 0;text-align:center;color:var(--text-muted);font-size:12px;margin-top:30px}
  footer a{color:var(--accent2);text-decoration:none}

  @media(max-width:600px){.map-wrap{height:340px}.card{padding:16px}}
  @media print{
    body::before,.tabs,.lang-btn,.map-wrap,.btn,#step-inputs,.status,header .head-actions{display:none!important}
    body{background:#fff;color:#000}.card,.tech,.tile,.chart-card,.winner{background:#fff;border-color:#bbb;color:#000}
    .tile .v,.tech-h b,.winner h3,td.num,.kv span:nth-child(even){color:#000}
    .tabpane{display:none!important}#tab-site{display:block!important}
  }
</style>
</head>
<body>
<div class="wrapper">

<header>
  <div class="logo">
    <div class="logo-icon">◈</div>
    <div class="logo-text"><h1>EnergyDNA</h1><p data-k="tagline"></p></div>
  </div>
  <div class="head-actions"><button class="lang-btn" id="lang-toggle" onclick="toggleLang()">🌐 عربي</button></div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" id="tabbtn-site" onclick="showTab('site')" data-k="tab_site"></button>
  <button class="tab" id="tabbtn-lab" onclick="showTab('lab')" data-k="tab_lab"></button>
</nav>

<!-- ═════════════ TAB 1 : SITE ANALYSIS ═════════════ -->
<div id="tab-site" class="tabpane active">

  <section class="hero">
    <h2 data-k="hero_h"></h2>
    <p data-k="hero_p"></p>
  </section>

  <div id="step-inputs">

  <!-- 1. LOCATION -->
  <div class="card">
    <div class="card-title"><span>① <span data-k="s1_t"></span></span></div>
    <div class="card-sub" data-k="s1_sub"></div>

    <div class="row">
      <input class="grow" id="place-q" data-kph="search_ph" onkeydown="if(event.key==='Enter')searchPlace()">
      <button class="btn" onclick="searchPlace()" data-k="btn_search"></button>
      <button class="btn" onclick="useMyLocation()" data-k="btn_loc"></button>
      <select id="gov" style="width:auto;min-width:170px" onchange="pickGov()"></select>
    </div>

    <div class="row" style="margin-top:12px">
      <div class="seg">
        <button id="prov-osm" class="on" onclick="setProvider('osm')" data-k="prov_osm"></button>
        <button id="prov-g" onclick="setProvider('google')">Google Maps</button>
      </div>
      <span class="hint" data-k="map_hint"></span>
    </div>

    <div class="gkey" id="gkey-box">
      <div class="row">
        <input class="grow" id="gkey" type="password" autocomplete="off" data-kph="gkey_ph">
        <button class="btn primary" onclick="saveGKey()" data-k="gkey_save"></button>
      </div>
      <div class="hint" style="margin-top:6px" data-k="gkey_note"></div>
    </div>

    <div class="map-wrap">
      <div id="map-leaflet"></div>
      <div id="map-google"></div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="field"><label data-k="lat"></label><input type="number" id="lat" step="0.0001" min="-90" max="90" oninput="onCoordInput()"></div>
      <div class="field"><label data-k="lon"></label><input type="number" id="lon" step="0.0001" min="-180" max="180" oninput="onCoordInput()"></div>
    </div>
  </div>

  <!-- 2. DEMAND -->
  <div class="card">
    <div class="card-title"><span>② <span data-k="s2_t"></span></span></div>
    <div class="card-sub" data-k="s2_sub"></div>
    <div class="grid">
      <div class="field"><label data-k="d_mode"></label>
        <select id="d-mode" onchange="onModeChange()"><option value="bill" data-k="d_mode_bill"></option><option value="kwh" data-k="d_mode_kwh"></option></select></div>
      <div class="field"><label id="d-val-label"></label><input type="number" id="d-val" value="1500" min="1"></div>
      <div class="field"><label data-k="price"></label><input type="number" id="price" value="2.18" step="0.05" min="0.1"><span class="hint" data-k="price_hint"></span></div>
      <div class="field"><label data-k="supply"></label>
        <select id="supply"><option value="grid" data-k="sup_grid"></option><option value="off" data-k="sup_off"></option></select></div>
      <div class="field"><label><span data-k="cov"></span>: <b id="cov-val">100%</b></label><input type="range" id="cov" min="30" max="100" step="5" value="100" oninput="$('cov-val').textContent=this.value+'%'"></div>
      <div class="field"><label data-k="area"></label><input type="number" id="area" value="300" min="0"><span class="hint" data-k="area_hint"></span></div>
      <div class="field"><label data-k="mount"></label>
        <select id="mount"><option value="roof" data-k="mnt_roof"></option><option value="ground" data-k="mnt_ground"></option></select></div>
      <div class="field"><label data-k="budget"></label><input type="number" id="budget" value="0" min="0"><span class="hint" data-k="budget_hint"></span></div>
    </div>
  </div>

  <!-- 3. OTHER RESOURCES -->
  <div class="card">
    <div class="card-title"><span>③ <span data-k="s3_t"></span></span></div>
    <div class="card-sub" data-k="s3_sub"></div>
    <div class="grid">
      <div class="field"><label data-k="heads"></label><input type="number" id="heads" value="0" min="0"></div>
      <div class="field"><label data-k="residue"></label><input type="number" id="residue" value="0" min="0" step="0.5"></div>
      <div class="field"><label data-k="hhead"></label><input type="number" id="hhead" value="0" min="0" step="0.5"></div>
      <div class="field"><label data-k="hflow"></label><input type="number" id="hflow" value="0" min="0"></div>
    </div>

    <details class="adv">
      <summary data-k="adv_t"></summary>
      <div class="hint" style="margin-top:8px" data-k="adv_note"></div>
      <div class="grid">
        <div class="field"><label data-k="a_cpv"></label><input type="number" id="a-cpv" value="16000"></div>
        <div class="field"><label data-k="a_cwind"></label><input type="number" id="a-cwind" value="100000"></div>
        <div class="field"><label data-k="a_cbio"></label><input type="number" id="a-cbio" value="70000"></div>
        <div class="field"><label data-k="a_chydro"></label><input type="number" id="a-chydro" value="90000"></div>
        <div class="field"><label data-k="a_cbatt"></label><input type="number" id="a-cbatt" value="10000"></div>
        <div class="field"><label data-k="a_esc"></label><input type="number" id="a-esc" value="5" step="0.5"></div>
        <div class="field"><label data-k="a_disc"></label><input type="number" id="a-disc" value="10" step="0.5"></div>
        <div class="field"><label data-k="a_pr"></label><input type="number" id="a-pr" value="80" min="50" max="95"></div>
        <div class="field"><label data-k="a_tilt"></label><input type="number" id="a-tilt" value="10" min="0" max="25"></div>
        <div class="field"><label data-k="a_hub"></label><input type="number" id="a-hub" value="30" min="10" max="120"></div>
        <div class="field"><label data-k="a_panel"></label><input type="number" id="a-panel" value="550" min="300" max="800"></div>
        <div class="field"><label data-k="a_co2"></label><input type="number" id="a-co2" value="0.5" step="0.05"></div>
      </div>
    </details>

    <button class="btn primary big" id="btn-analyze" onclick="runAnalysis()" data-k="btn_analyze"></button>
    <div class="status" id="status"></div>
  </div>

  </div><!-- /step-inputs -->

  <!-- RESULTS -->
  <div id="site-results"></div>

</div>

<!-- ═════════════ TAB 2 : DATA LAB ═════════════ -->
<div id="tab-lab" class="tabpane">
  <section class="hero">
    <h2 data-k="lab_h"></h2>
    <p data-k="lab_p"></p>
  </section>

  <div class="card">
    <div class="card-title"><span data-k="lab_data"></span></div>
    <div class="row" style="margin:10px 0">
      <span class="hint" data-k="lab_nasa"></span>
      <button class="btn" onclick="loadNasaSeries('ghi')">☀️ GHI</button>
      <button class="btn" onclick="loadNasaSeries('wind')">💨 <span data-k="lab_wind"></span></button>
      <button class="btn" onclick="loadNasaSeries('temp')">🌡️ <span data-k="lab_temp"></span></button>
    </div>
    <textarea id="data-input" data-kph="lab_ph"></textarea>
    <div class="row" style="margin-top:10px">

function pinIcon() { return L.divIcon({ className: 'pin', html: '<div class="pin-dot"></div>', iconSize: [22, 22], iconAnchor: [11, 22] }); }

function initLeaflet() {
  if (typeof L === 'undefined') { $('map-leaflet').innerHTML = '<p style="padding:20px">' + tr('Map library failed to load. Enter coordinates manually.', 'مكتبة الخريطة معملتش تحميل. أدخل الإحداثيات يدوياً.') + '</p>'; return; }
  const map = L.map('map-leaflet').setView([27.0, 30.5], 6);
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Imagery © Esri' });
  const street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  sat.addTo(map);
  L.control.layers({ 'Satellite': sat, 'Street': street }).addTo(map);
  map.on('click', e => setLocation(e.latlng.lat, e.latlng.lng, false));
  MapUI.leaflet = map;
}

function setLocation(lat, lon, pan, zoom) {
  lat = +lat; lon = +lon;
  if (!isFinite(lat) || !isFinite(lon)) return;
  $('lat').value = lat.toFixed(5); $('lon').value = lon.toFixed(5);
  placeMarker(lat, lon, pan, zoom);
}
function placeMarker(lat, lon, pan, zoom) {
  if (MapUI.leaflet) {
    if (!MapUI.lmarker) {
      MapUI.lmarker = L.marker([lat, lon], { icon: pinIcon(), draggable: true }).addTo(MapUI.leaflet);
      MapUI.lmarker.on('dragend', () => { const p = MapUI.lmarker.getLatLng(); setLocation(p.lat, p.lng, false); });
    } else MapUI.lmarker.setLatLng([lat, lon]);
    if (pan) MapUI.leaflet.setView([lat, lon], zoom || Math.max(MapUI.leaflet.getZoom(), 10));
  }
  if (MapUI.gmap && window.google) {
    const pos = { lat, lng: lon };
    if (!MapUI.gmarker) {
      MapUI.gmarker = new google.maps.Marker({ position: pos, map: MapUI.gmap, draggable: true });
      MapUI.gmarker.addListener('dragend', e => setLocation(e.latLng.lat(), e.latLng.lng(), false));
    } else MapUI.gmarker.setPosition(pos);
    if (pan) { MapUI.gmap.setCenter(pos); MapUI.gmap.setZoom(zoom || Math.max(MapUI.gmap.getZoom(), 10)); }
  }
}
function onCoordInput() {
  const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
  if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) placeMarker(lat, lon, true);
}

/* provider switch */
function setProvider(p) {
  if (p === 'google') {
    const key = getGKey();
    $('gkey-box').classList.add('show');
    if (key) { $('gkey').value = key; loadGoogle(key); } else { $('prov-g').classList.remove('on'); return; }
  } else {
    MapUI.provider = 'osm';
    $('prov-osm').classList.add('on'); $('prov-g').classList.remove('on');
    $('map-leaflet').style.display = 'block'; $('map-google').style.display = 'none';
    if (MapUI.leaflet) setTimeout(() => MapUI.leaflet.invalidateSize(), 50);
  }
}
function getGKey() { try { return localStorage.getItem('edna_gkey') || ''; } catch (e) { return ''; } }
function saveGKey() {
  const k = $('gkey').value.trim(); if (!k) return;
  try { localStorage.setItem('edna_gkey', k); } catch (e) {}
  loadGoogle(k);
}
function loadGoogle(key) {
  if (MapUI.gLoading) return;
  const show = () => {
    MapUI.provider = 'google';
    $('prov-g').classList.add('on'); $('prov-osm').classList.remove('on');
    $('map-leaflet').style.display = 'none'; $('map-google').style.display = 'block';
    if (!MapUI.gmap) {
      MapUI.gmap = new google.maps.Map($('map-google'), { center: { lat: 27, lng: 30.5 }, zoom: 6, mapTypeId: 'hybrid', streetViewControl: false });
      MapUI.gmap.addListener('click', e => setLocation(e.latLng.lat(), e.latLng.lng(), false));
    }
    const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
    if (isFinite(lat) && isFinite(lon)) placeMarker(lat, lon, true);
  };
  if (window.google && window.google.maps) { show(); return; }
  MapUI.gLoading = true;
  window.__gmReady = () => { MapUI.gLoading = false; MapUI.gReady = true; show(); };
  window.gm_authFailure = () => {
    MapUI.gLoading = false; setProvider('osm');
    setStatus('warn', tr('Google Maps rejected the key (check billing/APIs). Using free satellite map instead.', 'جوجل رفضت المفتاح (راجع الفوترة والـ APIs). بنستخدم الخريطة المجانية.'));
  };
  const s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&callback=__gmReady&loading=async';
  s.async = true;
  s.onerror = () => { MapUI.gLoading = false; setStatus('warn', tr('Could not load Google Maps. Using free map.', 'مقدرناش نحمّل جوجل ماب. بنستخدم الخريطة المجانية.')); };
  document.head.appendChild(s);
}

/* search */
async function searchPlace() {
  const q = $('place-q').value.trim(); if (!q) return;
  try {
    if (MapUI.provider === 'google' && window.google && google.maps) {
      new google.maps.Geocoder().geocode({ address: q }, (r, st) => {
        if (st === 'OK' && r[0]) { const p = r[0].geometry.location; setLocation(p.lat(), p.lng(), true, 12); }
        else setStatus('warn', tr('Place not found.', 'المكان مش موجود.'));
      });
      return;
    }
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=' + lang + '&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (j[0]) { setStatus('', ''); setLocation(j[0].lat, j[0].lon, true, 12); }
    else setStatus('warn', tr('Place not found.', 'المكان مش موجود.'));
  } catch (e) { setStatus('warn', tr('Search failed. Click the map instead.', 'البحث فشل. اضغط على الخريطة بدلاً منه.')); }
}
function useMyLocation() {
  if (!navigator.geolocation) return;

}

const CLIM_FULL = 'ALLSKY_SFC_SW_DWN,ALLSKY_SFC_SW_DNI,T2M,T2M_MAX,WS10M,WS50M,PS,RH2M,PRECTOTCORR';

async function fetchClimatology(lat, lon) {
  let j = null, lastErr = null;

    hyb.resEn = `${fmt(a * 100)}% PV / ${fmt(b * 100)}% wind · daily correlation ${corr === null ? 'n/a' : fmt(corr, 2)}`;
    hyb.resAr = `${fmt(a * 100)}% شمس / ${fmt(b * 100)}% رياح · ارتباط يومي ${corr === null ? 'غير متاح' : fmt(corr, 2)}`;
  } else if (!off) {
    hyb.noteEn = 'Not needed in grid-connected mode: the grid already balances supply (net metering). Switch to off-grid to see it.';
    hyb.noteAr = 'مش لازم في وضع الاتصال بالشبكة: الشبكة بتوازن العرض (net metering). غيّر لوضع معزول لتشوفه.';
  } else {
    hyb.noteEn = 'Wind is too weak or unavailable here, so a hybrid would not beat PV + battery.'; hyb.noteAr = 'الرياح ضعيفة أو غير متاحة هنا، فالهجين مش هيتفوق على الشمس + بطارية.';
  }

  /* ── ranking ── */
  const techs = [pv, wind, hyb, bio, hyd];
  techs.forEach(t => { if (t.eligible) { t.score = Math.round(t.parts.total); } else t.score = null; });
  const ranked = techs.filter(t => t.eligible).sort((a, b) => b.score - a.score);
  ranked.forEach((t, i) => { t.status = i === 0 ? 'best' : t.score >= 60 ? 'viable' : t.score >= 40 ? 'marginal' : 'poor'; if (t.parts.fea < 40 && t.status === 'viable') t.status = 'marginal'; });
  const winner = ranked[0] || pv;
  M.techs = techs; M.winner = winner;

  /* mix: if winner covers < target, complete with PV */
  M.mix = null;
  if (winner.coverage < 99 && winner.id !== 'pv') {
    const remT = T - winner.annualKWh, remKW = Math.max(0, remT / Ypv), panels = Math.ceil(remKW * 1000 / ctx.panelW);
    M.mix = { pvKW: panels * ctx.panelW / 1000, panels, pvGen: ypv.map(y => y * panels * ctx.panelW / 1000), cost: panels * ctx.panelW / 1000 * ctx.cPV, pct: 100 - winner.coverage };
  }

  /* complementary (non-electric / utility-scale / not assessable) */
  const tc = 4, stYield = clim.ann.ghi * 365.25 * ctx.tiltGain * 0.45;
  M.comp = {
    thermal: { perM2: stYield, tc, kWh: stYield * tc, egp: stYield * tc * ctx.price },
    csp: clim.ann.dni ? { dni: clim.ann.dni * 365.25 } : null
  };

  /* hybrid complementarity */
  M.complement = corr;
  return M;
}
/* ───────── READ INPUTS ───────── */
function readCtx() {
  const n = id => parseFloat($(id).value);
  const price = n('price') > 0 ? n('price') : 2.18;
  const dv = n('d-val');
  if (!(dv > 0)) throw new Error(tr('Enter your demand first.', 'أدخل الاستهلاك الأول.'));
  const demandDay = $('d-mode').value === 'bill' ? dv / price / 30 : dv;
  const coverage = clamp((n('cov') || 100) / 100, 0.3, 1);
  const g = (id, d) => isFinite(n(id)) ? n(id) : d;
  return {
    demandDay, coverage, targetDay: demandDay * coverage, price, supply: $('supply').value,
    area: g('area', 0), mount: $('mount').value, budget: g('budget', 0),
    heads: g('heads', 0), residue: g('residue', 0), head: g('hhead', 0), flow: g('hflow', 0),
    cPV: g('a-cpv', 16000), cWind: g('a-cwind', 100000), cBio: g('a-cbio', 70000), cHydro: g('a-chydro', 90000), cBatt: g('a-cbatt', 10000),
    esc: g('a-esc', 5) / 100, disc: g('a-disc', 10) / 100, pr: clamp(g('a-pr', 80) / 100, 0.5, 0.95), tiltGain: 1 + g('a-tilt', 10) / 100,
    hub: clamp(g('a-hub', 30), 10, 120), panelW: g('a-panel', 550), panelArea: 2.6, co2: g('a-co2', 0.5)
  };
}

/* ───────── RUN ───────── */
async function runAnalysis() {
  const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
  if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { setStatus('error', tr('Pick a location on the map first.', 'اختار مكان على الخريطة الأول.')); return; }
  let ctx; try { ctx = readCtx(); } catch (e) { setStatus('error', e.message); return; }
  $('btn-analyze').disabled = true;
  try {
    setStatus('loading', tr('Fetching NASA POWER climate data for this point…', 'بنسحب بيانات مناخ NASA POWER للنقطة دي…'));
    const clim = await fetchClimatology(lat, lon);
    setStatus('loading', tr('Fetching daily series to measure stability…', 'بنسحب السلسلة اليومية لقياس الاستقرار…'));
    let daily = null;
    try { daily = await fetchDaily(lat, lon); state.daily = daily; state.dailyKey = lat + ',' + lon; } catch (e) { daily = null; }
    state.model = buildModel(ctx, clim, daily); state.model.lat = lat; state.model.lon = lon;
    setStatus(daily ? '' : 'warn', daily ? '' : tr('Daily series unavailable: stability uses typical values instead of measured ones.', 'السلسلة اليومية مش متاحة: الاستقرار بيستخدم قيم نموذجية بدل المقاسة.'));
    renderResults();
    $('site-results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    console.error(e);
    setStatus('error', tr('Could not get NASA POWER data (' + e.message + '). Check your internet connection and try again.', 'مقدرناش نجيب بيانات NASA POWER (' + e.message + '). راجع الإنترنت وجرّب تاني.'));
  } finally { $('btn-analyze').disabled = false; }
}

  </div>

  <div class="sec-title">${tr('Side-by-side comparison', 'مقارنة جنب بعض')}</div>

  <div class="sec-title">${tr('Charts', 'الرسوم البيانية')}</div>

    <div class="chart-card"><h4>${tr('Monthly production vs your target (kWh)', 'الإنتاج الشهري مقابل هدفك (kWh)')} — ${nm(w)}</h4><div class="chart-box"><canvas id="chBalance"></canvas></div></div>
    <div class="chart-card"><h4>${tr('Seasonal resource profile', 'ملف المورد الموسمي')}</h4><div class="chart-box"><canvas id="chResource"></canvas></div></div>
    <div class="chart-card"><h4>${tr('Cumulative cash flow, 25 years (EGP)', 'التدفق النقدي التراكمي 25 سنة (جنيه)')}</h4><div class="chart-box"><canvas id="chCash"></canvas></div></div>
  </div>

  <div class="sec-title">${tr('Stability DNA (NASA daily data, last full year)', 'DNA الاستقرار (بيانات NASA اليومية، آخر سنة كاملة)')}</div>
  ${M.dailyOk ? `<div class="tscroll"><table><thead><tr><th>${tr('Series', 'السلسلة')}</th><th>${tr('Mean', 'المتوسط')}</th><th>CV</th><th>${tr('Stability idx', 'مؤشر الاستقرار')}</th><th>${tr('Max ramp', 'أكبر قفزة')}</th><th>${tr('Main cycle', 'الدورة الرئيسية')}</th><th>${tr('Longest low streak', 'أطول فترة ضعف')}</th></tr></thead><tbody>
    ${dnaRow(tr('Solar GHI (kWh/m²/d)', 'إشعاع شمسي (kWh/م²/يوم)'), M.dna.pv, M.st.pv)}
    ${dnaRow(tr('Wind capacity factor (daily)', 'معامل سعة الرياح (يومي)'), M.dna.wind, M.st.wind)}
    </tbody></table></div>
    <div class="hint" style="margin-top:8px">${M.corr !== null ? tr(`Sun–wind daily correlation: ${fmt(M.corr, 2)} (${M.corr < -0.2 ? 'complementary: a hybrid needs less storage' : M.corr > 0.2 ? 'they peak together: little hybrid benefit' : 'mostly independent'}).`, `الارتباط اليومي شمس–رياح: ${fmt(M.corr, 2)} (${M.corr < -0.2 ? 'متكاملين: الهجين يحتاج تخزين أقل' : M.corr > 0.2 ? 'بيزيدوا مع بعض: فايدة الهجين قليلة' : 'مستقلين تقريباً'}).`) : ''}
    <button class="btn" style="margin-inline-start:10px" onclick="loadNasaSeries('ghi',true)">🧬 ${tr('Open in Data Lab', 'افتح في معمل البيانات')}</button></div>`
    : `<div class="disclaimer">${tr('Daily series was not available, so typical variability values were used.', 'السلسلة اليومية مش متاحة، فاتستخدمت قيم تذبذب نموذجية.')}</div>`}

  <div class="sec-title">${tr('Tips for this site', 'نصايح للمكان ده')}</div>
  <ul class="tips">${tipsList(M).map(t => `<li class="${t[1]}">${t[0]}</li>`).join('')}</ul>

  <div class="disclaimer">${tr('NASA POWER is a gridded satellite/model dataset (roughly 50–100 km cells), so local terrain, obstacles and microclimate can differ. Costs are editable estimates, not quotes. Use this as a screening study, then confirm with on-site measurements and supplier offers. Surplus feed-in and net-metering rules depend on your distribution company.', 'NASA POWER بيانات شبكية من الأقمار والنماذج (خلايا حوالي 50–100 كم)، فالتضاريس والعوائق والمناخ المحلي ممكن يختلفوا. التكاليف تقديرات قابلة للتعديل مش عروض أسعار. استخدمها كدراسة أولية، وبعدها أكّد بقياسات في الموقع وعروض موردين. قواعد تغذية الفائض والـ net metering بتعتمد على شركة التوزيع.')}
    <div style="margin-top:10px"><button class="btn" onclick="window.print()">🖨️ ${tr('Print / save PDF', 'طباعة / حفظ PDF')}</button></div></div>`;
  el.style.display = 'block';
  drawCharts(M);
}

function drawCharts(M) {
  chartDefaults();
  const w = M.winner, mn = monthNames(), D = M.Dm;
  const sets = [];
  const col = { pv: '#e3882a', wind: '#388bfd', bio: '#2ea043', hydro: '#58a6ff' };
  const lab = { pv: tr('Solar', 'شمس'), wind: tr('Wind', 'رياح'), bio: tr('Biogas', 'بيوجاز'), hydro: tr('Hydro', 'مائية') };
  const gen = Object.assign({}, w.gen);
  if (M.mix) gen.pv = M.mix.pvGen;
  Object.keys(gen).forEach(k => sets.push({ type: 'bar', label: lab[k], data: gen[k].map(v => +v.toFixed(0)), backgroundColor: col[k] + 'cc', stack: 's', order: 2 }));
  sets.push({ type: 'line', label: tr('Target', 'الهدف'), data: D.map(v => +v.toFixed(0)), borderColor: '#f85149', borderDash: [6, 4], pointRadius: 0, order: 1 });
  state.charts.bal = new Chart($('chBalance'), { data: { labels: mn, datasets: sets }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } } } });

  const rs = [{ label: tr('GHI (kWh/m²/day)', 'إشعاع (kWh/م²/يوم)'), data: M.clim.ghi, borderColor: '#e3882a', backgroundColor: '#e3882a33', tension: .3, yAxisID: 'y', fill: true }];
  const sc = { y: { beginAtZero: true, title: { display: true, text: 'kWh/m²/day' } } };
  if (M.hasWind) { rs.push({ label: tr('Wind @hub (m/s)', 'رياح عند البرج (م/ث)'), data: M.vhub.map(v => +v.toFixed(2)), borderColor: '#388bfd', tension: .3, yAxisID: 'y2' }); sc.y2 = { position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: 'm/s' } }; }
  state.charts.res = new Chart($('chResource'), { type: 'line', data: { labels: mn, datasets: rs }, options: { responsive: true, maintainAspectRatio: false, scales: sc } });

  if (w.flow && w.flow.length) state.charts.cash = new Chart($('chCash'), { type: 'line', data: { labels: w.flow.map((_, i) => i), datasets: [{ label: tr('Cumulative cash (EGP)', 'التراكمي (جنيه)'), data: w.flow.map(v => Math.round(v)), borderColor: '#2ea043', backgroundColor: '#2ea04322', fill: true, tension: .2, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { title: { display: true, text: tr('Year', 'السنة') } } } } });
}
/* ───────── DATA LAB ───────── */
const labState = { dna: null, values: [], type: 'ghi' };

async function loadNasaSeries(type, fromResults) {
  const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
  const err = $('lab-err');
  if (!isFinite(lat) || !isFinite(lon)) { showTab('site'); setStatus('warn', tr('Pick a location first.', 'اختار مكان الأول.')); return; }
  const key = lat + ',' + lon;
  try {
    if (!state.daily || state.dailyKey !== key) { state.daily = await fetchDaily(lat, lon); state.dailyKey = key; }
  } catch (e) { showTab('lab'); err.textContent = tr('Could not fetch NASA daily data.', 'مقدرناش نجيب بيانات NASA اليومية.'); err.style.display = 'block'; return; }
  err.style.display = 'none';
  const d = state.daily; const arr = { ghi: d.ghi, wind: d.ws, temp: d.t }[type].filter(v => v !== null);
  $('data-input').value = arr.join(', ');
  $('est-type').value = type === 'temp' ? 'power' : type;
  $('csv-name').textContent = `NASA POWER · ${d.year} · ${type.toUpperCase()}`;
  onEstType();
  showTab('lab'); analyzeLab();
}

function handleCSV(event) {
  const file = event.target.files[0]; if (!file) return;
  $('csv-name').textContent = '📄 ' + file.name;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.replace(/\r\n?/g, '\n').split('\n').map(l => l.trim()).filter(Boolean);
    const delim = lines.some(l => l.includes(';')) ? ';' : ',';
    let hdr = -1, start = 0;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i]; if (/^[-#!]/.test(l) && isNaN(parseFloat(l))) continue;
      const cols = l.split(delim).map(c => c.trim().replace(/['"]/g, ''));
      if (isNaN(parseFloat(cols[0]))) { hdr = i; start = i + 1; } else { start = i; break; }
    }
    const target = hdr >= 0 ? lines[hdr].split(delim).length - 1 : -1;
    const vals = [];
    for (let i = start; i < lines.length; i++) {
      if (/^[-#!]/.test(lines[i]) && isNaN(parseFloat(lines[i]))) continue;
      const cols = lines[i].split(delim).map(c => c.trim().replace(/['"]/g, ''));
      let n;
      if (target >= 0 && target < cols.length) n = parseFloat(cols[target]);
      else for (let j = cols.length - 1; j >= 0; j--) { const v = parseFloat(cols[j]); if (!isNaN(v)) { n = v; break; } }
      if (n !== undefined && !isNaN(n) && n > -998) vals.push(n);
    }
    const err = $('lab-err');
    if (!vals.length) { err.textContent = tr('No numeric values found in the CSV.', 'مفيش أرقام في ملف CSV.'); err.style.display = 'block'; return; }
    err.style.display = 'none'; $('data-input').value = vals.join(', ');
  };
  reader.readAsText(file);
}

function analyzeLab() {
  const err = $('lab-err'); err.style.display = 'none';
  const vals = $('data-input').value.split(/[\s,;،]+/).map(parseFloat).filter(v => !isNaN(v));
  if (vals.length < 4) { err.textContent = tr('Enter at least 4 values.', 'أدخل 4 قيم على الأقل.'); err.style.display = 'block'; return; }
  labState.dna = computeDNA(vals); labState.values = vals;
  renderLab();
  $('lab-results').style.display = 'block';
  calcLabOutput();
}

function renderLab() {
  const d = labState.dna; if (!d) return;
  const card = (l, v, desc) => `<div class="metric-card"><div class="metric-label">${l}</div><div class="metric-value">${v}</div><div class="metric-desc">${desc}</div></div>`;
  $('lab-metrics').innerHTML = [
    card(tr('Mean', 'المتوسط'), fmt(d.mean, 3), tr('Average value', 'القيمة المتوسطة')),
    card(tr('Variance', 'التباين'), fmt(d.variance, 3), tr('Spread (unit²)', 'التشتت (وحدة²)')),
    card(tr('Std deviation', 'الانحراف المعياري'), fmt(d.std, 3), tr('Spread around mean', 'التشتت حول المتوسط')),
    card('CV', fmt(d.cv, 3), tr('Std ÷ mean: unit-free', 'الانحراف ÷ المتوسط: بدون وحدة')),
    card(tr('Max ramp', 'أكبر قفزة'), fmt(d.ramp, 3), tr('Biggest step between readings', 'أكبر تغير بين قراءتين')),
    card(tr('Stability index', 'مؤشر الاستقرار'), fmt(d.stabIdx, 3), tr('1/(1+CV²): 1 = perfectly stable', '1/(1+CV²): 1 = مستقر تماماً')),
    card(tr('Main cycle', 'الدورة الرئيسية'), d.period ? fmt(d.period, 1) : '—', tr('Samples per cycle (Fourier)', 'عينات لكل دورة (فورير)'))
  ].join('');
  // chart
  if (state.charts.lab) state.charts.lab.destroy();
  chartDefaults();
  const v = labState.values, m = d.mean;
  state.charts.lab = new Chart($('labChart'), { type: 'line', data: { labels: v.map((_, i) => i + 1), datasets: [
    { label: tr('Series', 'السلسلة'), data: v, borderColor: '#388bfd', pointRadius: v.length > 100 ? 0 : 2, borderWidth: 1.5, tension: .15 },
    { label: tr('Mean', 'المتوسط'), data: v.map(() => m), borderColor: '#2ea043', borderDash: [6, 4], pointRadius: 0 },
    { label: '+1σ', data: v.map(() => m + d.std), borderColor: '#e3882a66', pointRadius: 0, borderWidth: 1 },
    { label: '−1σ', data: v.map(() => m - d.std), borderColor: '#e3882a66', pointRadius: 0, borderWidth: 1 }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { maxTicksLimit: 12 } } } } });
  // interpretation
  const it = [];
  if (d.cv < 0.2) it.push(['', tr(`<strong>Stable source</strong>: CV ${fmt(d.cv, 2)} means readings stay close to the mean.`, `<strong>مصدر مستقر</strong>: CV ${fmt(d.cv, 2)} يعني القراءات قريبة من المتوسط.`)]);
  else if (d.cv < 0.5) it.push(['warn', tr(`<strong>Moderate variability</strong>: CV ${fmt(d.cv, 2)}. Some storage or a grid link will smooth delivery.`, `<strong>تذبذب متوسط</strong>: CV ${fmt(d.cv, 2)}. تخزين بسيط أو ربط بالشبكة هيساوي الإمداد.`)]);
  else it.push(['warn', tr(`<strong>High variability</strong>: CV ${fmt(d.cv, 2)}. Plan for storage, backup, or pairing with a complementary source.`, `<strong>تذبذب عالي</strong>: CV ${fmt(d.cv, 2)}. خطط لتخزين أو احتياطي أو مصدر مكمّل.`)]);
  if (d.mean > 0 && d.ramp > 0.5 * d.mean) it.push(['warn', tr(`<strong>Sharp jumps</strong>: largest step ${fmt(d.ramp, 2)} (over 50% of the mean).`, `<strong>قفزات حادة</strong>: أكبر خطوة ${fmt(d.ramp, 2)} (أكتر من 50% من المتوسط).`)]);
  else it.push(['', tr(`<strong>Gradual changes</strong>: largest step ${fmt(d.ramp, 2)}.`, `<strong>تغيرات تدريجية</strong>: أكبر خطوة ${fmt(d.ramp, 2)}.`)]);
  if (d.period) it.push(['info', tr(`<strong>Dominant cycle</strong>: the pattern repeats about every ${fmt(d.period, 1)} samples${d.n >= 300 && Math.abs(d.period - d.n) < 5 ? ' (a yearly season)' : ''}.`, `<strong>الدورة السائدة</strong>: النمط بيتكرر تقريباً كل ${fmt(d.period, 1)} عينة${d.n >= 300 && Math.abs(d.period - d.n) < 5 ? ' (موسم سنوي)' : ''}.`)]);
  $('lab-interp').innerHTML = it.map(i => `<li><div class="dot ${i[0]}"></div><span>${i[1]}</span></li>`).join('');
}

function onEstType(keep) {
  const t = $('est-type').value;
  $('est-hours-f').style.display = t === 'power' ? 'flex' : 'none';
  $('est-area-l').textContent = t === 'wind' ? tr('Rotor swept area (m²)', 'مساحة مسح الريشة (م²)') : tr('Panel area (m²)', 'مساحة الألواح (م²)');
  $('est-eff-l').textContent = t === 'wind' ? tr('Power coefficient Cp (%)', 'معامل القدرة Cp (%)') : tr('Panel efficiency (%)', 'كفاءة الألواح (%)');
  $('est-area').parentElement.style.display = t === 'power' ? 'none' : 'flex';
  $('est-eff').parentElement.style.display = t === 'power' ? 'none' : 'flex';
  if (!keep) $('est-eff').value = t === 'wind' ? 35 : 20;
}
function calcLabOutput() {
  const d = labState.dna; if (!d) return;
  const t = $('est-type').value, g = id => parseFloat($(id).value);
  const area = g('est-area') || 50, eff = (g('est-eff') || 20) / 100, price = g('est-price') || 2.18, home = g('est-home') || 20, hours = g('est-hours') || 24;
  let kwhDay = 0;
  if (t === 'ghi') kwhDay = area * eff * d.mean * 0.8;
  else if (t === 'wind') { const rho = 1.2; kwhDay = avg(labState.values.map(v => v < 3 || v > 25 ? 0 : 0.5 * rho * area * eff * Math.pow(Math.min(v, 12), 3) / 1000)) * 24; }
  else kwhDay = d.mean * hours;
  const o = [[fmt(kwhDay, 1), tr('kWh / day', 'kWh / يوم')], [fmt(kwhDay * 30), tr('kWh / month', 'kWh / شهر')], [fmt(kwhDay / home, 1), tr('Homes powered', 'بيوت بتشتغل')], [fmt(kwhDay * 30 * price), tr('EGP / month value', 'جنيه / شهر قيمة')]];
  const el = $('est-out'); el.style.display = 'grid';
  el.innerHTML = o.map(x => `<div class="output-card"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
}

document.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') { $('tab-lab').classList.contains('active') ? analyzeLab() : runAnalysis(); } });
